<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Manager{% block title_suffix %}{% endblock %}</title>
<style>
  :root { color-scheme: light dark; --nav-size: 56px; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif; margin: 0; line-height: 1.4;
    padding-bottom: calc(var(--nav-size) + env(safe-area-inset-bottom));
  }
  .container { max-width: 640px; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.3rem; margin: 0.5rem 0 1rem; }
  section { border: 1px solid #8884; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
  h2 { font-size: 1.05rem; margin-top: 0; }
  label { display: block; font-size: 0.85rem; margin: 0.75rem 0 0.25rem; opacity: 0.8; }
  input[type=text], input[type=password], input[type=search], textarea, select {
    width: 100%; padding: 0.45rem 0.5rem; font-size: 0.95rem;
    border: 1px solid #8886; border-radius: 4px; background: transparent; color: inherit;
  }
  textarea { min-height: 4rem; font-family: monospace; font-size: 0.8rem; }
  .row { display: flex; gap: 0.5rem; align-items: center; }
  .row input { flex: 1; }
  button {
    padding: 0.45rem 0.9rem; border-radius: 4px; border: 1px solid #8886;
    background: #8881; color: inherit; cursor: pointer; font-size: 0.9rem;
  }
  button:hover { background: #8882; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .badge { font-size: 0.75rem; padding: 0.1rem 0.5rem; border-radius: 999px; }
  .badge.set { background: #2a72; }
  .badge.unset { background: #8884; }
  .status { font-size: 0.85rem; min-height: 1.2rem; margin-top: 0.5rem; }
  .status.ok { color: #2a7; }
  .status.err { color: #d55; }
  p.hint { font-size: 0.8rem; opacity: 0.7; }
  code { font-size: 0.8rem; }
  a { color: inherit; }

  /* Bottom tab bar on mobile, top bar on wider screens -- thumb-reachable
     nav is the point on a phone, and it maps cleanly onto a future app shell. */
  nav.tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex;
    border-top: 1px solid #8884; background: Canvas;
    padding-bottom: env(safe-area-inset-bottom);
    height: var(--nav-size); z-index: 10;
  }
  nav.tabbar a {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-decoration: none; color: inherit; font-size: 0.7rem; opacity: 0.55;
  }
  nav.tabbar a.active { opacity: 1; font-weight: 600; }
  nav.tabbar .icon { font-size: 1.25rem; line-height: 1.3; }

  @media (min-width: 720px) {
    body { padding-bottom: 0; padding-top: var(--nav-size); }
    nav.tabbar {
      top: 0; bottom: auto; justify-content: center; gap: 2.5rem;
      border-top: none; border-bottom: 1px solid #8884;
    }
    nav.tabbar a { flex: none; flex-direction: row; gap: 0.4rem; font-size: 0.9rem; }
  }
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav class="tabbar">
  <a href="/review" class="{{ 'active' if active_tab == 'review' else '' }}"><span class="icon">🎧</span>Review</a>
  <a href="/library" class="{{ 'active' if active_tab == 'library' else '' }}"><span class="icon">📚</span>Library</a>
  <a href="/settings" class="{{ 'active' if active_tab == 'settings' else '' }}"><span class="icon">⚙️</span>Settings</a>
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
