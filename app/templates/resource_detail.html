{% extends "base.html" %}
{% block title_suffix %} — Review{% endblock %}
{% block head %}
<style>
  :root { --player-size: 64px; }
  body { padding-bottom: calc(var(--nav-size) + var(--player-size) + env(safe-area-inset-bottom)); }
  @media (min-width: 720px) { body { padding-bottom: var(--player-size); } }

  .back-link { display: inline-block; margin-bottom: 0.75rem; font-size: 0.9rem; opacity: 0.7; text-decoration: none; }
  h1 { font-size: 1.1rem; word-break: break-word; margin-bottom: 0.25rem; }
  .subline { font-size: 0.85rem; opacity: 0.7; margin-bottom: 1rem; }
  .fail-banner { border: 1px solid #d55; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1.25rem; font-size: 0.9rem; }
  .fail-banner strong { display: block; margin-bottom: 0.25rem; }

  .btn-group { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .btn-group button { flex: 1 1 auto; min-width: 45%; }
  .btn-group button.selected { background: #2a72; border-color: #2a7; font-weight: 600; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.6rem; }
  .chip {
    display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.2rem 0.6rem;
    border-radius: 999px; background: #8882; font-size: 0.85rem;
  }
  .chip button { padding: 0 0.2rem; border: none; background: none; font-size: 0.9rem; line-height: 1; }

  .photo-strip { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.25rem; }
  .photo-strip img { height: 90px; border-radius: 6px; flex-shrink: 0; }

  .clip-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid #8882; font-size: 0.9rem; }
  .clip-row:last-child { border-bottom: none; }
  .clip-actions button { font-size: 0.8rem; padding: 0.15rem 0.5rem; margin-left: 0.3rem; }
  .clip-add-row { display: flex; gap: 0.4rem; align-items: end; margin-top: 0.75rem; flex-wrap: wrap; }
  .clip-add-row .field { display: flex; flex-direction: column; }
  .clip-add-row label { margin: 0 0 0.2rem; }
  .clip-add-row input { width: 5.5rem; }

  .file-btn { width: 100%; padding: 0.8rem; font-size: 1rem; font-weight: 600; margin-top: 0.5rem; }
  .file-btn.ready { background: #2a72; border-color: #2a7; }

  .player-bar {
    position: fixed; left: 0; right: 0; bottom: var(--nav-size);
    height: var(--player-size); background: Canvas; border-top: 1px solid #8884;
    display: flex; align-items: center; padding: 0 1rem; z-index: 9;
  }
  .player-bar { gap: 0.5rem; }
  .player-bar audio { display: none; }
  .pb-play { flex: none; width: 2.5rem; height: 2.5rem; border-radius: 50%; padding: 0; font-size: 1rem; line-height: 1; }
  .pb-time { flex: none; font-size: 0.75rem; font-variant-numeric: tabular-nums; min-width: 2.4rem; text-align: center; opacity: 0.85; }
  .pb-wave { flex: 1; min-width: 0; height: 48px; cursor: pointer; display: block; color: CanvasText; }
  .pb-expand { flex: none; font-size: 1.3rem; text-decoration: none; padding: 0 0.15rem; }

  .wf-wrap { border: 1px solid #8884; border-radius: 8px; padding: 0.4rem 0.5rem 0.5rem; }
  /* touch-action pan-y: a vertical swipe still scrolls the page, horizontal drags pan the waveform */
  .wf-canvas { width: 100%; height: 110px; display: block; touch-action: pan-y; cursor: pointer; color: CanvasText; }
  .wf-bar { display: flex; gap: 0.4rem; align-items: center; margin-top: 0.4rem; font-size: 0.8rem; flex-wrap: wrap; }
  .wf-bar button { padding: 0.15rem 0.7rem; }
  .wf-time { margin-left: auto; font-variant-numeric: tabular-nums; opacity: 0.8; }

  .map-box { position: relative; height: 260px; border: 1px solid #8884; border-radius: 8px; overflow: hidden; margin-bottom: 0.4rem; }
  .map-box canvas { width: 100%; height: 100%; display: block; }
  .loc-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.4rem; }
  .loc-actions button { font-size: 0.85rem; padding: 0.25rem 0.7rem; }
  .loc-actions label { font-size: 0.85rem; }
  @media (min-width: 720px) { .player-bar { bottom: 0; } }
</style>
{% endblock %}
{% block content %}
<a class="back-link" href="/review">&larr; Review Queue</a>
<div id="detail" class="status">Loading...</div>
{% endblock %}
{% block scripts %}
<script src="/static/waveform.js"></script>
<script src="/static/map.js"></script>
<script>
const resourceId = {{ resource_id | tojson }};
let allCategories = [];  // [{slug, label}] from /api/categories: configurable, not a fixed list
let currentTags = [];   // [{id, name}]
let allTags = [];       // [{id, name}] -- for datalist suggestions
let allProjects = [];   // [{id, name, slug}]
let allSessions = [];   // [{id, project_id, name, session_date, notes, file_count}]

function formatDuration(seconds) {
  if (!seconds && seconds !== 0) return '';
  const m = Math.floor(seconds / 60);
  const s = Math.round(seconds % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  });
  children.forEach(c => e.append(c));
  return e;
}

async function patchResource(body) {
  const r = await fetch(`/api/resources/${resourceId}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

async function loadDetail() {
  const container = document.getElementById('detail');
  try {
    const [resource, projects, tags, sessions, categories] = await Promise.all([
      fetch(`/api/resources/${resourceId}`).then(r => r.json()),
      fetch('/api/projects').then(r => r.json()),
      fetch('/api/tags').then(r => r.json()),
      fetch('/api/sessions').then(r => r.json()),
      fetch('/api/categories').then(r => r.json()),
    ]);
    allCategories = categories;
    allProjects = projects;
    allSessions = sessions;
    allTags = tags;
    currentTags = tags.filter(t => resource.tags.includes(t.name));
    renderDetail(resource);
  } catch (e) {
    container.textContent = 'Error loading: ' + e.message;
    container.className = 'status err';
  }
}

function renderDetail(resource) {
  const container = document.getElementById('detail');
  container.className = '';
  container.innerHTML = '';

  const h1 = el('h1', {}, [resource.filename]);  // el() uses append(), never innerHTML -- safe for untrusted filenames
  const subline = el('div', { class: 'subline' });
  subline.textContent = `${formatDuration(resource.duration_seconds)} · ${resource.status}`;
  container.append(h1, subline);

  if (resource.status === 'failed') {
    const banner = el('div', { class: 'fail-banner' });
    const strong = el('strong', {}, ['Failed: ' + (resource.failure_stage || 'unknown stage')]);
    const detail = document.createElement('div');
    detail.textContent = resource.failure_detail || '';
    banner.append(strong, detail);
    container.append(banner);
  }

  // Order is the workflow: when and where come first because they're
  // the anchors -- location/photos enrichment hangs off the timestamp,
  // and what a recording *is* (project, category, tags) is mostly
  // answerable once you know when and where it was made.
  container.append(buildWaveformSection(resource));
  container.append(buildCapturedAtSection(resource));
  container.append(buildLocationSection(resource));
  if (resource.has_photos) container.append(buildPhotosSection());
  container.append(buildCategorySection(resource));
  container.append(buildProjectSection(resource));
  container.append(buildSessionSection(resource));
  container.append(buildTagsSection(resource));
  container.append(buildNotesSection(resource));
  container.append(buildClipsSection(resource));

  const fileBtn = el('button', {
    class: 'file-btn' + (resource.category ? ' ready' : ''),
    type: 'button',
    onclick: () => fileResource(resource),
  }, [resource.status === 'filed' ? 'Filed' : 'File this recording']);
  fileBtn.disabled = !resource.category || resource.status === 'filed';
  container.append(fileBtn);
  const fileStatus = el('div', { id: 'file-status', class: 'status' });
  container.append(fileStatus);

  setupPlayer(resource);
}

function buildCategorySection(resource) {
  const section = el('section');
  section.append(el('h2', {}, ['Category']));
  const group = el('div', { class: 'btn-group' });
  // A file may still carry an archived category: show it (selected) even though it isn't offered for new use.
  const offered = allCategories.slice();
  if (resource.category && !offered.some(c => c.slug === resource.category)) offered.push({ slug: resource.category, label: resource.category });
  for (const cat of offered) {
    const btn = el('button', {
      type: 'button',
      class: cat.slug === resource.category ? 'selected' : '',
      onclick: async () => {
        try {
          const updated = await patchResource({ category: cat.slug });
          renderDetail(updated);
        } catch (e) { alert('Error: ' + e.message); }
      },
    }, [cat.label]);
    group.append(btn);
  }
  section.append(group);
  return section;
}

function buildProjectSection(resource) {
  const section = el('section');
  section.append(el('h2', {}, ['Project']));
  const select = el('select', {
    onchange: async (ev) => {
      try {
        const updated = await patchResource({ project_id: ev.target.value || null });
        renderDetail(updated);
      } catch (e) { alert('Error: ' + e.message); }
    },
  });
  select.append(el('option', { value: '' }, ['(none)']));
  for (const p of allProjects) {
    const opt = el('option', { value: p.id }, [p.name]);
    if (p.id === resource.project_id) opt.selected = true;
    select.append(opt);
  }
  section.append(select);

  const row = el('div', { class: 'row', style: 'margin-top:0.5rem' });
  const nameInput = el('input', { type: 'text', placeholder: 'New project name' });
  const addBtn = el('button', {
    type: 'button',
    onclick: async () => {
      const name = nameInput.value.trim();
      if (!name) return;
      const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      try {
        const r = await fetch('/api/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, slug }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || r.statusText);
        const updated = await patchResource({ project_id: data.id });
        renderDetail(updated);
      } catch (e) { alert('Error: ' + e.message); }
    },
  }, ['+ New']);
  row.append(nameInput, addBtn);
  section.append(row);
  return section;
}

async function apiJson(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

// A session is one night of a show / one outing. It lives inside the file's project (or, with
// no project, is a loose outing), so only the sessions of the current project are offered.
function buildSessionSection(resource) {
  const section = el('section');
  section.append(el('h2', {}, ['Session']));
  const here = allSessions.filter(s => (s.project_id || null) === (resource.project_id || null));
  const select = el('select', {
    onchange: async (ev) => {
      try { renderDetail(await patchResource({ session_id: ev.target.value || null })); }
      catch (e) { alert('Error: ' + e.message); }
    },
  });
  select.append(el('option', { value: '' }, ['(none)']));
  for (const s of here) {
    const opt = el('option', { value: s.id }, [s.name]);
    if (s.id === resource.session_id) opt.selected = true;
    select.append(opt);
  }
  section.append(select);

  const row = el('div', { class: 'row', style: 'margin-top:0.5rem' });
  const nameInput = el('input', { type: 'text', placeholder: 'New session, e.g. 2026-09-15 Night 2' });
  let dateOnly = null;
  if (resource.captured_at) {
    const d = new Date(resource.captured_at);
    const pad = n => String(n).padStart(2, '0');
    dateOnly = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    nameInput.value = dateOnly + ' ';
  }
  const addBtn = el('button', {
    type: 'button',
    onclick: async () => {
      const name = nameInput.value.trim();
      if (!name || name === dateOnly) return;
      try {
        const body = { name, project_id: resource.project_id || null, session_date: dateOnly };
        if (window.crypto && crypto.randomUUID) body.id = crypto.randomUUID();  // a retried create can't duplicate
        const created = await apiJson('POST', '/api/sessions', body);
        allSessions.push(created);
        renderDetail(await patchResource({ session_id: created.id }));
      } catch (e) { alert('Error: ' + e.message); }
    },
  }, ['+ New']);
  row.append(nameInput, addBtn);
  section.append(row);

  const current = allSessions.find(s => s.id === resource.session_id);
  if (current) {
    const notes = el('textarea', { rows: '3', placeholder: 'Notes about this session (venue, set-up, what happened)' });
    notes.value = current.notes || '';
    notes.addEventListener('blur', async () => {
      if (notes.value === (current.notes || '')) return;
      try { current.notes = (await apiJson('PATCH', `/api/sessions/${current.id}`, { notes: notes.value })).notes; }
      catch (e) { alert('Error: ' + e.message); }
    });
    section.append(el('p', { class: 'hint' }, [`${current.file_count} file(s) in this session.`]), notes);
  }
  return section;
}

function buildNotesSection(resource) {
  const section = el('section');
  section.append(el('h2', {}, ['Notes']));
  const notes = el('textarea', { rows: '4', placeholder: 'Anything worth remembering about this recording' });
  notes.value = resource.notes || '';
  notes.addEventListener('blur', async () => {
    if (notes.value === (resource.notes || '')) return;
    try { resource.notes = (await patchResource({ notes: notes.value })).notes; }
    catch (e) { alert('Error: ' + e.message); }
  });
  section.append(notes);
  if (resource.filename_info && resource.filename_info.is_edit && !resource.derived_from_id) {
    const box = el('div', { class: 'hint' }, ['The filename says this is an edited version. ']);
    section.append(box);
    apiJson('GET', `/api/resources/${resource.id}/edit-candidates`).then(list => {
      if (!list.length) { box.append('No matching original found in the library yet.'); return; }
      box.append('Is it an edit of: ');
      list.forEach(c => {
        const b = el('button', { type: 'button' }, [c.filename]);
        b.addEventListener('click', async () => {
          try { renderDetail(await patchResource({ derived_from_id: c.id })); } catch (e) { alert('Error: ' + e.message); }
        });
        box.append(b, ' ');
      });
    }).catch(() => {});
  }
  if (resource.role && resource.role !== 'original') {
    section.append(el('p', { class: 'hint' }, [
      `This file is an ${resource.role}` + (resource.derived_from_id ? ' of another file in the library.' : '.'),
    ]));
  }
  return section;
}

function buildTagsSection(resource) {
  const section = el('section');
  section.append(el('h2', {}, ['Tags']));
  const chipRow = el('div', { class: 'chip-row' });
  for (const tag of currentTags) {
    const removeBtn = el('button', {
      type: 'button',
      onclick: async () => {
        try {
          const updated = await patchResource({ tags: currentTags.filter(t => t.id !== tag.id).map(t => t.id) });
          currentTags = currentTags.filter(t => t.id !== tag.id);
          renderDetail(updated);
        } catch (e) { alert('Error: ' + e.message); }
      },
    }, ['×']);
    chipRow.append(el('span', { class: 'chip' }, [tag.name, removeBtn]));
  }
  section.append(chipRow);

  const row = el('div', { class: 'row' });
  const input = el('input', { type: 'text', list: 'tag-suggestions', placeholder: 'Add tag, press Enter' });
  const datalist = el('datalist', { id: 'tag-suggestions' });
  for (const t of allTags) datalist.append(el('option', { value: t.name }));
  input.addEventListener('keydown', async (ev) => {
    if (ev.key !== 'Enter') return;
    ev.preventDefault();
    const name = input.value.trim();
    if (!name) return;
    try {
      const r = await fetch('/api/tags', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      });
      const tag = await r.json();
      if (!r.ok) throw new Error(tag.error || r.statusText);
      if (!currentTags.some(t => t.id === tag.id)) currentTags.push(tag);
      const updated = await patchResource({ tags: currentTags.map(t => t.id) });
      renderDetail(updated);
    } catch (e) { alert('Error: ' + e.message); }
  });
  row.append(input, datalist);
  section.append(row);
  return section;
}

function buildCapturedAtSection(resource) {
  const section = el('section');
  const info = resource.filename_info || {};
  const precision = resource.captured_at ? (resource.captured_at_precision || 'exact') : 'unknown';
  section.append(el('h2', {}, [
    'Captured at ',
    el('span', { class: 'badge unset' }, [resource.captured_at_source || 'manual']),
    ' ',
    el('span', { class: precision === 'exact' ? 'badge set' : 'badge unset' }, [precision]),
  ]));
  const input = el('input', { type: 'datetime-local' });
  if (resource.captured_at) {
    // captured_at is a UTC instant ("...Z") from the API -- render it in the browser's
    // local time for editing, then convert back to a UTC instant on save below.
    const d = new Date(resource.captured_at);
    const pad = n => String(n).padStart(2, '0');
    input.value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  input.addEventListener('change', async () => {
    if (!input.value) return;
    try {
      const iso = new Date(input.value).toISOString();
      const updated = await patchResource({ captured_at: iso, captured_at_source: 'manual' });
      renderDetail(updated);
    } catch (e) { alert('Error: ' + e.message); }
  });
  section.append(input);

  if (resource.captured_at) {
    const select = el('select', {}, [
      el('option', { value: 'exact' }, ['Exact time']),
      el('option', { value: 'approximate' }, ['Approximate time']),
    ]);
    select.value = precision;
    select.addEventListener('change', async () => {
      try { renderDetail(await patchResource({ captured_at_precision: select.value })); }
      catch (e) { alert('Error: ' + e.message); }
    });
    section.append(select);
    if (precision !== 'exact') {
      section.append(el('p', { class: 'hint' }, ['Approximate times are not looked up for a location or photos.']));
    }
  } else if (resource.suggested_captured_at) {
    const d = new Date(resource.suggested_captured_at);
    const when = info.time_known === false
      ? d.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' })
      : d.toLocaleString(undefined, { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    const row = el('p', { class: 'hint' }, [
      `The filename suggests ${when}` + (info.profile ? ` (${info.profile})` : '') +
        (info.time_known === false ? ', with no time of day. ' : '. '),
    ]);
    const use = el('button', { type: 'button' }, ['Use this date']);
    use.addEventListener('click', async () => {
      try { renderDetail(await patchResource({ use_suggested_date: true })); }
      catch (e) { alert('Error: ' + e.message); }
    });
    row.append(use);
    section.append(row);
  } else if (info.unknown_reason) {
    section.append(el('p', { class: 'hint' }, ['Date unknown: ' + info.unknown_reason + '. Enter it above; location lookup waits for an exact date.']));
  } else {
    section.append(el('p', { class: 'hint' }, ['No date found. Location enrichment can\'t run until one is set.']));
  }

  if (info.title) {
    section.append(el('p', { class: 'hint' }, [
      `Description in the filename: \u201c${info.title}\u201d` + (info.is_edit ? ' (an edited version)' : ''),
    ]));
  }
  return section;
}

// ---------------- location + map ----------------
// The map is drawn by app/static/map.js. When the recording has a GPS track the route is drawn on it, a marker follows
// the audio along the route, and clicking the route jumps the audio to that moment.
let mapCfg = null;
let mapListeners = [];
let locationNote = '';        // shown once, after the re-render that follows a lookup

function detachMap() {
  mapListeners.forEach(([t, ev, fn]) => t.removeEventListener(ev, fn));
  mapListeners = [];
}

async function getMapConfig() {
  if (!mapCfg) mapCfg = await apiJson('GET', '/api/map/config');
  return mapCfg;
}

function buildLocationSection(resource) {
  detachMap();
  const section = el('section');
  const loc = resource.location;
  section.append(el('h2', {}, ['Location ', loc ? el('span', { class: 'badge unset' }, [loc.source]) : '']));

  if (loc) section.append(buildPlaceRow(resource));
  const picker = { active: false };
  const status = el('p', { class: 'hint' }, ['']);
  const holder = el('div');
  const follow = el('input', { type: 'checkbox', checked: 'checked' });
  const followLabel = el('label', {}, [follow, ' follow']);
  followLabel.hidden = true;
  const ctl = { setPick: null };

  const describe = () => (loc ? `${loc.lat.toFixed(5)}, ${loc.lon.toFixed(5)}` : 'No location yet.') +
    (resource.has_track ? ' · click the route to play from that moment.' : '');
  status.textContent = (locationNote ? locationNote + ' ' : '') + describe();
  locationNote = '';

  const mountMap = () => { holder.replaceChildren(); mountTrackMap(holder, resource, picker, status, follow, followLabel, ctl); };
  if (loc || resource.has_track) mountMap();

  const canLookUp = !!resource.captured_at && (resource.captured_at_precision || 'exact') === 'exact';
  const refresh = el('button', { type: 'button', title: canLookUp ? 'Ask Dawarich where you were at that time' : 'Needs an exact date and time' }, ['Look up from Dawarich']);
  refresh.disabled = !canLookUp;
  refresh.addEventListener('click', async () => {
    refresh.disabled = true; status.textContent = 'Looking up…';
    try {
      const r = await apiJson('POST', `/api/resources/${resource.id}/location/refresh`, {});
      locationNote = r.found ? `Found ${r.track_points} GPS point${r.track_points === 1 ? '' : 's'} around that time.`
                             : (r.track_points ? 'Found a track but no position for the start.' : 'Dawarich has no points for that time.');
      if (r.kept_manual_location) locationNote += ' Your manual location was kept.';
      renderDetail(await (await fetch(`/api/resources/${resource.id}`)).json());
    } catch (e) { refresh.disabled = false; status.textContent = 'Error: ' + e.message; }
  });
  const pick = el('button', { type: 'button' }, ['Choose on map']);
  pick.addEventListener('click', () => {
    if (!holder.firstChild) mountMap();
    picker.active = !picker.active;
    pick.textContent = picker.active ? 'Cancel choosing' : 'Choose on map';
    if (ctl.setPick) ctl.setPick(picker.active);
    if (picker.active) status.textContent = 'Click the map where this was recorded.';
    else status.textContent = describe();
  });
  const actions = el('div', { class: 'loc-actions' }, [refresh, pick, followLabel]);
  if (loc) actions.append(el('a', { href: '/map?focus=' + encodeURIComponent(resource.id) }, ['Show on the big map →']));
  section.append(holder, status, actions);

  const row = el('div', { class: 'row' });
  const latInput = el('input', { type: 'text', placeholder: 'lat', value: loc ? loc.lat : '' });
  const lonInput = el('input', { type: 'text', placeholder: 'lon', value: loc ? loc.lon : '' });
  const saveBtn = el('button', {
    type: 'button',
    onclick: async () => {
      const lat = parseFloat(latInput.value), lon = parseFloat(lonInput.value);
      if (Number.isNaN(lat) || Number.isNaN(lon)) { alert('Enter numeric lat/lon'); return; }
      try {
        const updated = await patchResource({ location: { lat, lon, source: 'manual' } });
        renderDetail(updated);
      } catch (e) { alert('Error: ' + e.message); }
    },
  }, ['Set']);
  row.append(latInput, lonInput, saveBtn);
  section.append(row);
  return section;
}

// The name of the place, looked up from the coordinates (Photon) or typed by hand. Typing replaces the looked-up
// name and it is then never overwritten; clearing it asks for a fresh lookup.
function buildPlaceRow(resource) {
  const loc = resource.location;
  const input = el('input', { type: 'text', placeholder: 'Place name (looked up automatically)', value: loc.place_name || '' });
  const badge = el('span', { class: 'badge unset' }, [loc.place_source === 'manual' ? 'typed' : (loc.place_name ? 'auto' : 'not named yet')]);
  input.addEventListener('change', async () => {
    try { renderDetail(await patchResource({ place_name: input.value })); } catch (e) { alert('Error: ' + e.message); }
  });
  const again = el('button', { type: 'button', title: 'Look the name up again', 'aria-label': 'Look up the place name again' }, ['↻']);
  again.addEventListener('click', async () => {
    if (loc.place_source === 'manual' && !confirm('Replace the name you typed with a looked-up one?')) return;
    again.disabled = true;
    try {
      await apiJson('POST', `/api/resources/${resource.id}/place/lookup`, {});
      renderDetail(await (await fetch(`/api/resources/${resource.id}`)).json());
    } catch (e) { alert(e.message); again.disabled = false; }
  });
  return el('div', { class: 'row', style: 'margin-bottom:0.4rem' }, [input, again, badge]);
}

async function mountTrackMap(holder, resource, picker, status, follow, followLabel, ctl) {
  const canvas = el('canvas');
  holder.append(el('div', { class: 'map-box' }, [canvas]));
  try {
    const cfg = await getMapConfig();
    const map = new AudioMap.TileMap(canvas, { tileUrl: cfg.tile_url, attribution: cfg.attribution, maxZoom: cfg.max_zoom, wheelZoom: 'ctrl' });
    const audio = () => document.getElementById('player');
    let layer = null;

    if (resource.has_track) {
      const track = await apiJson('GET', `/api/resources/${resource.id}/track`);
      const points = track.map(p => ({ lat: p.lat, lon: p.lon, offset_seconds: p.offset_seconds }));
      if (points.length) {
        layer = new AudioMap.TrackLayer(points, { duration: resource.duration_seconds, getTime: () => (audio() ? audio().currentTime : 0) });
        map.overlays.push((ctx, m) => layer.draw(ctx, m));
        followLabel.hidden = false;
      }
    }
    if (!layer && resource.location) {
      const pin = new AudioMap.PinLayer(resource.location.lat, resource.location.lon);
      map.overlays.push((ctx, m) => pin.draw(ctx, m));
    }
    if (layer) map.fitBounds(layer.points, 36, 17);
    else if (resource.location) map.setView(resource.location.lat, resource.location.lon, 16);
    else map.setView(52.5, -1.9, 6);

    ctl.setPick = (on) => { map.cursor = on ? 'crosshair' : 'grab'; canvas.style.cursor = map.cursor; };
    if (picker.active) ctl.setPick(true);

    map.onClick = async (x, y, ll) => {
      if (picker.active) {
        picker.active = false;
        try { renderDetail(await patchResource({ location: { lat: ll.lat, lon: ll.lon, source: 'manual' } })); }
        catch (e) { alert('Error: ' + e.message); }
        return;
      }
      if (!layer) return;
      const hit = layer.hit(map, x, y, 26);
      const a = audio();
      if (hit && a) {
        a.currentTime = hit.offset;
        status.textContent = `Playing from ${AudioMap.fmtTime(hit.offset)}.`;
        // A click is a user gesture, so the browser allows this. (Tapping the waveform only seeks: that is
        // what you want when you are placing a clip start/end and need the position to hold still.)
        const started = a.play();
        if (started && started.catch) started.catch(() => { status.textContent = `Jumped to ${AudioMap.fmtTime(hit.offset)}; press play.`; });
        map.schedule();
      }
    };
    map.onHover = (x, y) => { if (layer && !picker.active) layer.setHover(map, x, y); };
    canvas.addEventListener('pointerleave', () => { if (layer) layer.setHover(map, null, null); });

    // Keep the marker in step with the audio (and follow it when it leaves the view).
    let raf = null;
    const tick = () => {
      const a = audio();
      if (layer && follow.checked && a && !a.paused) {
        const at = AudioMap.interpolatePosition(layer.points, a.currentTime);
        const s = map.toScreen(at.lat, at.lon), { w, h } = map.size();
        if (s.x < w * 0.12 || s.x > w * 0.88 || s.y < h * 0.12 || s.y > h * 0.88) map.panBy(s.x - w / 2, s.y - h / 2);
      }
      map.schedule();
      raf = (a && !a.paused && document.body.contains(canvas)) ? requestAnimationFrame(tick) : null;
    };
    const kick = () => { if (!raf) raf = requestAnimationFrame(tick); };
    const redraw = () => map.schedule();
    const a = audio();
    if (a) {
      for (const ev of ['play', 'playing']) { a.addEventListener(ev, kick); mapListeners.push([a, ev, kick]); }
      for (const ev of ['seeked', 'timeupdate', 'pause', 'loadedmetadata']) { a.addEventListener(ev, redraw); mapListeners.push([a, ev, redraw]); }
      if (!a.paused) kick();
    }
    map.schedule();
  } catch (e) {
    holder.replaceChildren(el('p', { class: 'hint' }, ['The map could not be loaded: ' + e.message]));
  }
}

function buildPhotosSection() {
  const section = el('section');
  section.append(el('h2', {}, ['Companion photos']));
  const strip = el('div', { class: 'photo-strip status' });
  strip.textContent = 'Loading...';
  section.append(strip);
  fetch(`/api/resources/${resourceId}/photos`).then(r => r.json()).then(photos => {
    strip.className = 'photo-strip';
    strip.innerHTML = '';
    for (const p of photos) {
      const a = el('a', { href: p.original_url, target: '_blank' });
      const img = el('img', { src: p.thumbnail_url, loading: 'lazy' });
      a.append(img);
      strip.append(a);
    }
  }).catch(() => { strip.textContent = 'Failed to load photos.'; strip.className = 'photo-strip status err'; });
  return section;
}

function buildClipsSection(resource) {
  const section = el('section');
  section.append(el('h2', {}, ['Clips']));
  const list = el('div', { id: 'clip-list', class: 'status' });
  list.textContent = 'Loading...';
  section.append(list);
  loadClips(list, resource);

  const addRow = el('div', { class: 'clip-add-row' });
  const startField = el('div', { class: 'field' }, [el('label', {}, ['Start (s)']), el('input', { type: 'number', id: 'clip-start', step: '0.1', min: '0' })]);
  const endField = el('div', { class: 'field' }, [el('label', {}, ['End (s)']), el('input', { type: 'number', id: 'clip-end', step: '0.1', min: '0' })]);
  const labelField = el('div', { class: 'field' }, [el('label', {}, ['Label']), el('input', { type: 'text', id: 'clip-label' })]);
  const useStartBtn = el('button', { type: 'button', onclick: () => { document.getElementById('clip-start').value = getPlayerTime().toFixed(1); } }, ['Use player pos']);
  const useEndBtn = el('button', { type: 'button', onclick: () => { document.getElementById('clip-end').value = getPlayerTime().toFixed(1); } }, ['Use player pos']);
  startField.append(useStartBtn);
  endField.append(useEndBtn);
  const addBtn = el('button', {
    type: 'button',
    onclick: async () => {
      const start = parseFloat(document.getElementById('clip-start').value);
      const end = parseFloat(document.getElementById('clip-end').value);
      const label = document.getElementById('clip-label').value.trim();
      if (Number.isNaN(start) || Number.isNaN(end)) { alert('Enter start and end seconds'); return; }
      try {
        const r = await fetch(`/api/resources/${resourceId}/clips`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ start_seconds: start, end_seconds: end, label: label || null }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || r.statusText);
        loadClips(list, resource);
      } catch (e) { alert('Error: ' + e.message); }
    },
  }, ['Add clip']);
  addRow.append(startField, endField, labelField, addBtn);
  section.append(addRow);
  return section;
}

async function loadClips(list, resource) {
  try {
    const clips = await fetch(`/api/resources/${resourceId}/clips`).then(r => r.json());
    list.className = '';
    list.innerHTML = '';
    if (clips.length === 0) {
      list.textContent = 'No clips yet.';
      return;
    }
    for (const clip of clips) {
      const row = el('div', { class: 'clip-row' });
      const label = el('span');
      label.textContent = `${formatDuration(clip.start_seconds)}–${formatDuration(clip.end_seconds)}` + (clip.label ? ' · ' + clip.label : '');
      const actions = el('span', { class: 'clip-actions' });
      const exportBtn = el('button', {
        type: 'button',
        onclick: async () => {
          exportBtn.disabled = true;
          exportBtn.textContent = 'Queuing...';
          try {
            const r = await fetch(`/api/clips/${clip.id}/export`, { method: 'POST' });
            const data = await r.json();
            if (!r.ok) throw new Error(data.error || r.statusText);
            pollExport(data.id, exportBtn);
          } catch (e) {
            exportBtn.disabled = false;
            exportBtn.textContent = 'Export';
            alert('Error: ' + e.message);
          }
        },
      }, ['Export']);
      const deleteBtn = el('button', {
        type: 'button',
        onclick: async () => {
          if (!confirm('Delete this clip?')) return;
          await fetch(`/api/clips/${clip.id}`, { method: 'DELETE' });
          loadClips(list, resource);
        },
      }, ['Delete']);
      actions.append(exportBtn, deleteBtn);
      row.append(label, actions);
      list.append(row);
    }
  } catch (e) {
    list.textContent = 'Error loading clips: ' + e.message;
    list.className = 'status err';
  }
}

async function pollExport(exportId, btn) {
  for (let i = 0; i < 30; i++) {
    await new Promise(res => setTimeout(res, 2000));
    const exp = await fetch(`/api/exports/${exportId}`).then(r => r.json());
    if (exp.status === 'success') {
      btn.textContent = 'Download';
      btn.disabled = false;
      btn.onclick = () => window.open(`/api/exports/${exportId}/download`, '_blank');
      return;
    }
    if (exp.status === 'error') {
      btn.textContent = 'Failed';
      return;
    }
  }
  btn.textContent = 'Still processing…';
}

// ---------------- waveform ----------------
// Drawing, zooming, selecting and parsing all live in the shared component (app/static/waveform.js), which the bottom
// player and the full-screen editor use too. This page only wires it to the audio element.
let waveListeners = [];             // [target, event, handler] so a re-render can detach the old ones

function detachWaveform() {
  waveListeners.forEach(([t, ev, fn]) => t.removeEventListener(ev, fn));
  waveListeners = [];
}

function buildWaveformSection(resource) {
  detachWaveform();
  const section = el('section');
  section.append(el('h2', {}, ['Waveform ', el('a', { href: `/edit/${resource.id}`, class: 'hint', style: 'font-weight:normal;font-size:0.8rem' }, ['Open the editor →'])]));
  const wrap = el('div', { class: 'wf-wrap' });
  const note = el('p', { class: 'hint' }, ['Generating the waveform… this takes a few seconds.']);
  section.append(wrap);
  wrap.append(note);

  if (resource.waveform_error) {
    note.textContent = 'The waveform could not be made: ' + resource.waveform_error + ' ';
    const retry = el('button', { type: 'button' }, ['Try again']);
    retry.addEventListener('click', async () => {
      try { await apiJson('POST', `/api/resources/${resource.id}/previews/regenerate`, {}); renderDetail(await (await fetch(`/api/resources/${resource.id}`)).json()); }
      catch (e) { alert('Error: ' + e.message); }
    });
    note.append(retry);
    return section;
  }

  let tries = 0;
  const load = async () => {
    // A re-render replaces this section; a newer one has taken over (the check has to happen AFTER the section is
    // attached, which is why the first call below is deferred: at build time it isn't on the page yet).
    if (!document.body.contains(wrap)) return;
    try {
      const wf = await AudioWave.loadWaveform(resource.id);
      if (!wf) {
        if (++tries < 200) setTimeout(load, 3000); else note.textContent = 'The waveform is taking too long; check the job log.';
        return;
      }
      if (!document.body.contains(wrap)) return;
      wrap.replaceChildren();
      mountWaveform(wrap, wf);
    } catch (e) { note.textContent = 'The waveform could not be loaded: ' + e.message; }
  };
  setTimeout(load, 0);                                       // after renderDetail has attached this section
  return section;
}

function mountWaveform(wrap, wf) {
  const canvas = el('canvas', { class: 'wf-canvas' });
  const zoomOut = el('button', { type: 'button', 'aria-label': 'Zoom out' }, ['−']);
  const zoomIn = el('button', { type: 'button', 'aria-label': 'Zoom in' }, ['+']);
  const fit = el('button', { type: 'button' }, ['Fit']);
  const label = el('span', { class: 'wf-time' }, ['']);
  wrap.append(canvas, el('div', { class: 'wf-bar' }, [zoomOut, zoomIn, fit, label]));

  const audio = () => document.getElementById('player');
  const view = new AudioWave.WaveView(canvas, {
    wf, zoomable: true,
    getTime: () => (audio() ? audio().currentTime : 0),
    onSeek: (t) => { const a = audio(); if (a) a.currentTime = t; },          // tapping the waveform only seeks
    onDraw: (v) => {
      const now = audio() ? audio().currentTime : 0;
      label.textContent = `${AudioWave.fmtClock(now)} / ${AudioWave.fmtClock(v.duration)}` +
        (v.span < v.duration - 0.01 ? `  · ${AudioWave.fmtClock(v.start)}–${AudioWave.fmtClock(v.start + v.span)}` : '');
    },
  });
  zoomIn.addEventListener('click', () => view.zoomBy(2));
  zoomOut.addEventListener('click', () => view.zoomBy(0.5));
  fit.addEventListener('click', () => view.fit());

  // Keep the playhead in step with the audio, following it when zoomed in.
  let raf = null;
  const follow = () => {
    const a = audio();
    if (a && view.span < view.duration && !a.paused) view.ensureVisible(a.currentTime);
    view.draw();
    raf = (a && !a.paused && document.body.contains(canvas)) ? requestAnimationFrame(follow) : null;
  };
  const kick = () => { if (!raf) raf = requestAnimationFrame(follow); };
  const redraw = () => view.draw();
  const a = audio();
  if (a) {
    for (const ev of ['play', 'playing']) { a.addEventListener(ev, kick); waveListeners.push([a, ev, kick]); }
    for (const ev of ['seeked', 'timeupdate', 'pause', 'loadedmetadata']) { a.addEventListener(ev, redraw); waveListeners.push([a, ev, redraw]); }
  }
  view.draw();
}

function getPlayerTime() {
  const audio = document.getElementById('player');
  return audio ? audio.currentTime : 0;
}

function setupPlayer(resource) {
  let bar = document.getElementById('player-bar');
  if (bar) return;  // only created once, survives re-renders of #detail
  bar = el('div', { class: 'player-bar', id: 'player-bar' });
  // No native controls: the bar is the UI. Prefer the compressed listening copy (a 30-minute 32-bit WAV is ~700 MB);
  // fall back to the original while the copy is still being made. Both have the same length.
  const audio = el('audio', { id: 'player', preload: 'metadata' });
  audio.src = resource.has_preview ? `/api/resources/${resourceId}/preview` : `/api/resources/${resourceId}/audio`;
  const play = el('button', { class: 'pb-play', type: 'button', 'aria-label': 'Play' }, ['▶']);
  const cur = el('span', { class: 'pb-time' }, ['0:00']);
  const canvas = el('canvas', { class: 'pb-wave' });
  const dur = el('span', { class: 'pb-time' }, [AudioWave.fmtClock(resource.duration_seconds || 0)]);
  const expand = el('a', { class: 'pb-expand', href: `/edit/${resource.id}`, title: 'Open the waveform editor', 'aria-label': 'Open the waveform editor' }, ['⛶']);
  bar.append(audio, play, cur, canvas, dur, expand);
  document.body.append(bar);

  const view = new AudioWave.WaveView(canvas, {
    duration: resource.duration_seconds || 0, scrub: true,
    getTime: () => audio.currentTime || 0,
    onSeek: (t) => { audio.currentTime = t; },
  });
  play.addEventListener('click', () => { if (audio.paused) { const p = audio.play(); if (p && p.catch) p.catch(() => {}); } else audio.pause(); });
  const sync = () => { play.textContent = audio.paused ? '▶' : '⏸'; play.setAttribute('aria-label', audio.paused ? 'Play' : 'Pause'); };
  for (const ev of ['play', 'pause', 'ended']) audio.addEventListener(ev, sync);
  audio.addEventListener('loadedmetadata', () => { if (isFinite(audio.duration) && !view.wf) view.setDuration(audio.duration); dur.textContent = AudioWave.fmtClock(isFinite(audio.duration) ? audio.duration : (resource.duration_seconds || 0)); });
  let raf = null;
  const tick = () => { cur.textContent = AudioWave.fmtClock(audio.currentTime || 0); view.draw(); raf = audio.paused ? null : requestAnimationFrame(tick); };
  const kick = () => { if (!raf) raf = requestAnimationFrame(tick); };
  audio.addEventListener('play', kick);
  for (const ev of ['seeked', 'timeupdate', 'pause']) audio.addEventListener(ev, () => { cur.textContent = AudioWave.fmtClock(audio.currentTime || 0); view.draw(); });
  view.draw();

  // The waveform arrives a little after the page (it is generated in the background); until then the bar is a plain
  // progress line that already works as a scrubber.
  let tries = 0;
  const load = async () => {
    if (!document.body.contains(bar)) return;
    try {
      const wf = await AudioWave.loadWaveform(resource.id);
      if (wf) { view.setWaveform(wf, resource.duration_seconds); return; }
      if (++tries < 200) setTimeout(load, 3000);
    } catch (e) { /* the recording page shows the reason; the bar just stays a progress line */ }
  };
  setTimeout(load, 0);
}

// Filing copies the recording to the NAS in the background (large files take a while), so this
// only queues it and then waits, polling, until it is filed or has failed.
async function fileResource(resource) {
  const statusEl = document.getElementById('file-status');
  try {
    let current = await patchResource({ status: 'filed' });
    statusEl.className = 'status';
    for (let i = 0; current.status === 'filing'; i++) {
      statusEl.textContent = 'Copying to the NAS' + '.'.repeat(1 + (i % 3));
      await new Promise(res => setTimeout(res, 2000));
      current = await (await fetch(`/api/resources/${resourceId}`)).json();
    }
    if (current.status === 'filed') {
      statusEl.textContent = 'Filed. Back to the queue…';
      statusEl.className = 'status ok';
      setTimeout(() => { location.href = '/review'; }, 800);
    } else {
      renderDetail(current);   // failed: the banner shows why, and the button can try again
    }
  } catch (e) {
    statusEl.textContent = 'Error: ' + e.message;
    statusEl.className = 'status err';
  }
}

loadDetail();
</script>
